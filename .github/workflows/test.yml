name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os.name }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Ubuntu
            suffix: ubuntu
            runner: ubuntu-latest

          - name: macOS
            suffix: macos
            runner: macos-latest

          - name: Windows
            suffix: windows
            runner: windows-latest

    steps:
      - id: setup
        run: |
          artifact_id="$PR_PREFIX${GITHUB_SHA:0:7}-$GITHUB_RUN_ATTEMPT"
          echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          PR_PREFIX: >-
            ${{
              github.event_name == 'pull_request' &&
                format('PR{0}-', github.event.number) || ''
            }}

      - uses: actions/checkout@v7

      - uses: $/
        with:
          style: classic

      - uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{
              format(
                'index-{0}_{1}',
                steps.setup.outputs.artifact-id,
                matrix.os.suffix
              )
            }}
          path: index.html
